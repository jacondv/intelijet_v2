# Auto-cleanup policy for <BASE_DIR>/<DATA_DIR>/Projects (see
# ui/services/project_repository.py's PROJECT_DIR - this is the same
# folder). Checked once at app startup by
# pps/scripts/storage_cleanup_node.py (not a periodic/background check).
# Not merged into last_used.yaml like commond/lidar/runtime.yaml - read
# directly via shared.config_loader.load_config("storage_cleanup.yaml"),
# so there's no stale cache to clear after editing it (same convention
# as machine_info.yaml).
max_data_gb: 100
max_projects: 50
