#crop_pointcloud_by_box
crop_box:
  min:
    x: -1.0
    y: -5.0
    z: 0.2
  max:
    x: 7.0
    y: 5.0
    z: 8.0


# Start Housing possition in degree (start to collect data)
housing_start_position : 12 # value in degree (not in radian)
housing_end_position : 135 # value in degree (not in radian)
encoder_length_at_zero_possition: 29910924 # this value is readed from encoder when housing is at fully closed position

housing_open_speed_fast : 115 # speed in hz
housing_open_speed_medium : 105 # speed in hz
housing_open_speed_slow : 103 # speed in hz

housing_close_speed_fast : 115 # speed in hz
housing_close_speed_medium : 110 # speed in hz
housing_close_speed_slow : 105 # speed in hz

thickness:
  target: 30  # target thickness in mm
  tolerance: 10 # allowable tolerance in mm

# Parameters for pps.cloud_processing.compare_pipeline.CloudComparePipeline.run()
# (used via shared.config_loader.CONFIG with these exact values as fallback
# defaults in code, so a machine whose last_used.yaml predates this section
# keeps working unchanged - see compare_pipeline.py::_cfg()).
compare_pipeline:
  crop_box:
    min: [0, -10, -0.3]
    max: [11, 10, 8]
  keypoint:
    pixel_radius: 100
    cloud_radius: 0.5
    match_ratio: 0.5
  clustering:
    eps: 0.1
    min_points: 10
    max_cluster_size_pass1: 100
    max_cluster_size_pass2: 0

# Parameters for pps.tunnel_processing.TunnelProcessing.run_processing_pipeline()
# (wall/ground plane detection boxes - default = current hardcoded values, see
# docs/plan/phase_12_tunnel_processing_cleanup.md). `top` is defined for parity
# with the other 5 walls but not used yet by any remove_*() call - known issue,
# left for a future phase.
tunnel_processing:
  plane_detection:
    normal_angle_threshold: 5
    radius: 0.15
  boxes:
    front:  {min: [0, -5.0, -0.5], max: [3.5, 5.0, 8.0]}
    back:   {min: [4.0, -5.0, 0.0], max: [11.0, 5.0, 8.0]}
    left:   {min: [2.5, 0.0, -0.5], max: [8.0, 5.0, 8.0]}
    right:  {min: [2.5, -5.0, -0.5], max: [8.0, 0.0, 8.0]}
    bottom: {min: [2.5, -5.0, -1.5], max: [11.0, 5.0, 1.5]}
    top:    {min: [2.5, -5.0, 4.0], max: [11.0, 5.0, 8.0]}

report:
  sitename: "Jacon Equipment (test only)"
  jobnumer: "Jobnumber (test only)"
  target: 30
  tolerance: 10
  thickness_avg: 0
  shotcrete_vol: 0
