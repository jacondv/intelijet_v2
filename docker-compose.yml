# Single source of truth for running Intelijet in Docker - used both for
# manual dev iteration (`docker compose up --build`) and by the desktop
# icon launcher (install.sh generates it; run_docker.sh drives this file).
#
# One-time per host session (X11 GUI access), before `up` - run_docker.sh
# already does this, only needed manually if you invoke `docker compose`
# yourself:
#   xhost +local:docker
services:
  intelijet:
    build:
      context: .
      dockerfile: Dockerfile
    image: jacondv/jacon-pps-noetic:latest
    container_name: intelijet
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY}
      # Container runs as root (HOME=/root) - point it at the Xauthority
      # bind-mounted below instead of the (nonexistent) /root/.Xauthority.
      # Without this, X11 access relies entirely on run_docker.sh's
      # `xhost +local:docker`, which some X server/session setups reject
      # even with that granted ("Authorization required, but no
      # authorization protocol specified").
      XAUTHORITY: /root/.Xauthority
      QT_X11_NO_MITSHM: "1"
      XDG_RUNTIME_DIR: /tmp/runtime-root
      DISABLE_ROS1_EOL_WARNINGS: "1"
    volumes:
      - .:/root/intelijet_v2
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro
      # QSettings("JaconEquipment", "Intelijet") in ui/scripts/app.py (e.g.
      # last_prescan_path) writes to ~/.config/JaconEquipment by Qt's own
      # default - that's /root/.config/JaconEquipment in the container,
      # which is NOT under the repo mount above and would be wiped on
      # every `docker compose down` otherwise. Redirect it into the repo,
      # next to last_used.yaml, instead of some host user's home directory
      # (keeps all persistent state in one place, independent of which
      # Linux user runs the icon).
      - ./intelijet_v2_ws/src/config/.config:/root/.config/JaconEquipment
      # kornia's LoFTR (ai_core_pkg image_matcher_service, used for compare
      # keypoint matching) downloads its pretrained weights from the
      # internet into ~/.cache/torch/hub on first use - i.e.
      # /root/.cache in the container. Without this mount, the desktop
      # icon's down+up-every-click restart (see run_docker.sh) would
      # re-download it on every single launch, which also just fails
      # outright on a kiosk machine with no internet access. Kept under
      # data/ (already gitignored, **/data/) rather than config/ since
      # it's a large download cache, not small app settings.
      - ./data/.cache:/root/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /dev/dri:/dev/dri
    cap_add:
      - SYS_TIME
    stdin_open: true
    tty: true
    # restart is driven by the desktop icon (run_docker.sh: down, then up
    # -d, every click) and the app's own Exit button - not by Docker's own
    # restart policy.
    restart: "no"
    command: ["bash", "-c", "/root/intelijet_v2/run_intelijet.sh"]
